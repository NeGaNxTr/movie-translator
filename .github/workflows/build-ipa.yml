name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project MovieTranslator.xcodeproj \
            -scheme MovieTranslator \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/MovieTranslator.app"
          if [ ! -d "$APP" ]; then
            echo "ERROR: $APP not found"; exit 1
          fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr MovieTranslator.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MovieTranslator-unsigned-ipa
          path: MovieTranslator.ipa
          if-no-files-found: error